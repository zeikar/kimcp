[project]
name = "kimcp"
version = "0.1.0"
description = "Korea-integrated Model Context Protocol server implementation for seamless integration of Korean APIs into LLM applications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0,<3",
]

[project.urls]
Homepage = "https://github.com/zeikar/kimcp"
Repository = "https://github.com/zeikar/kimcp"

[project.authors]
[project.authors.zeikar]
name = "zeikar"
email = "zeikar.dev@gmail.com"

[project.license]
text = "MIT"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
